[package]
name = "hirameki"
version = "0.3.3"
description = "Hirameki — a visual inspiration mood board"
authors = ["arbxz"]
license = "MIT"
repository = "https://github.com/arbxz/hirameki"
edition = "2021"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "hirameki_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["protocol-asset"] }
tauri-plugin-opener = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tauri-plugin-sql = { version = "2.4.0", features = ["sqlite"] }
tauri-plugin-dialog = "2.7.1"
uuid = { version = "1.27.0", features = ["v4"] }
reqwest = { version = "0.13", default-features = false, features = ["rustls-no-provider"] }
# reqwest 0.13 defaults to the aws-lc crypto provider; use ring, as the Tauri plugins do.
rustls = { version = "0.23", default-features = false, features = ["ring", "std"] }
base64 = "0.23"
log = "0.4"
tauri-plugin-log = "2"

# Self-updater (desktop only — stores handle updates on mobile).
[target.'cfg(not(any(target_os = "android", target_os = "ios")))'.dependencies]
tauri-plugin-updater = "2"
tauri-plugin-process = "2"

